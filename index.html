<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <link rel="icon" href="./public/svgs/favicon.svg" />
    <title>Architecture Diagram</title>
  </head>
  <body>
    <header>
      <select id="diagram-picker" aria-label="Choose diagram"></select>
    </header>

    <section class="button-group">
      <button id="zoom-in" aria-label="Zoom in">
        <span class="svg-group svg-magnifier-add svg-size-sm"></span>
      </button>
      <button id="zoom-out" aria-label="Zoom out">
        <span class="svg-group svg-magnifier-remove svg-size-sm"></span>
      </button>
      <button id="reset" aria-label="Reset view">
        <span class="svg-group svg-reset svg-size-sm"></span>
      </button>
    </section>

    <div id="stage">
      <div id="loading">Rendering diagram…</div>
      <div id="diagram-container" style="display: none"></div>
    </div>
    <div class="hint">Pinch or scroll to zoom · drag to pan</div>
  </body>

  <script defer type="module" src="./src/main.ts"></script>
</html>
